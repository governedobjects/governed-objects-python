[project]
name = "governed-objects"
version = "0.2.0"
description = "Governed Objects runtime — a reusable primitive for policy-aware organizational assets"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governed_objects"]

# Positive runtime-only source distribution.
[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = ["src/governed_objects", "pyproject.toml", "README.md", "GOVERNANCE.md", "PRINCIPLES.md", "LICENSE", "NOTICE", "LICENSING.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
